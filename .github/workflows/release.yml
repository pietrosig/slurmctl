name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release asset
        run: |
          mkdir -p dist
          cp slurmctl.py dist/slurmctl
          chmod +x dist/slurmctl
          test -f dist/slurmctl

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/slurmctl
          prerelease: false
          draft: false
          make_latest: true
