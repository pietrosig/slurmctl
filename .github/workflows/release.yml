name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches tag
        run: |
          python3 -m py_compile slurmctl.py
          version="$(python3 slurmctl.py --version | awk '{print $2}')"
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "could not read __version__ from slurmctl.py" >&2
            exit 1
          fi
          if [ "$version" != "$tag" ]; then
            echo "__version__ ($version) does not match tag ($tag)" >&2
            exit 1
          fi

      - name: Build release asset
        run: |
          mkdir -p dist
          cp slurmctl.py dist/slurmctl
          chmod +x dist/slurmctl
          test -f dist/slurmctl

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/slurmctl
          prerelease: false
          draft: false
          make_latest: true
